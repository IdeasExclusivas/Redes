<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando - Parroquia Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Load our data -->
    <script src="data.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .checkbox-custom:checked + div {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .checkbox-custom:checked + div svg {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans" x-data="appData()" x-init="initApp()">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span class="font-bold text-xl">Centro de Mando - Parroquia Digital</span>
                </div>
                <div class="flex items-center gap-3">
                    <!-- Cloud Sync Indicator -->
                    <div x-show="cloudSyncing" class="flex items-center gap-1 text-xs bg-indigo-500/50 text-white px-2 py-1 rounded-full animate-pulse">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Guardando...
                    </div>
                    <span class="text-sm bg-indigo-500 py-1 px-3 rounded-full">Año 2027</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar: Week Selector -->
        <aside class="w-full md:w-64 shrink-0">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sticky top-6 max-h-[90vh] overflow-y-auto">
                <h2 class="font-bold text-lg mb-4 text-indigo-900 border-b pb-2">Calendario 2027</h2>
                <div class="space-y-3">
                    <template x-for="mes in mesesList" :key="mes">
                        <div class="border border-slate-200 rounded-lg overflow-hidden shadow-sm" x-show="getWeeksForMonth(mes).length > 0">
                            <!-- Botón del Mes -->
                            <button @click="toggleMes(mes)" class="w-full bg-slate-50 px-4 py-3 font-bold text-slate-700 flex justify-between items-center hover:bg-slate-100 transition-colors">
                                <span x-text="mes"></span>
                                <svg :class="mesesAbiertos[mes] ? 'rotate-180' : ''" class="w-4 h-4 transition-transform text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <!-- Lista de Semanas (Colapsable) -->
                            <div x-show="mesesAbiertos[mes]" class="bg-white p-2 space-y-1 border-t border-slate-100">
                                <template x-for="week in getWeeksForMonth(mes)" :key="week.semana">
                                    <button @click="selectWeek(week.originalIndex)" 
                                        :class="currentWeekIndex === week.originalIndex ? 'bg-indigo-50 border-indigo-200 text-indigo-700 font-semibold' : 'hover:bg-slate-50 border-transparent text-slate-600'"
                                        class="w-full text-left px-3 py-2 rounded-md border transition-colors flex items-center justify-between text-sm">
                                        <span>Semana <span x-text="week.semana"></span></span>
                                        <!-- Burbuja de progreso -->
                                        <span class="text-[10px] py-0.5 px-1.5 rounded-full" 
                                              :class="getWeekProgress(week.originalIndex) === 100 ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'"
                                              x-text="getWeekProgress(week.originalIndex) + '%'">
                                        </span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="content-area" class="flex-1" x-cloak>
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-slate-900">Semana <span x-text="currentWeek.semana"></span>: <span x-text="currentWeek.tema"></span></h1>
                <p class="text-slate-500 mt-1" x-text="currentWeek.fecha"></p>
                
                <!-- Progress Bar -->
                <div class="mt-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between text-sm font-medium mb-2">
                        <span class="text-slate-600">Progreso de la semana</span>
                        <span class="text-indigo-600" x-text="getWeekProgress(currentWeekIndex) + '%'"></span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5">
                        <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" :style="'width: ' + getWeekProgress(currentWeekIndex) + '%'"></div>
                    </div>
                </div>
            </div>

            <!-- Social Networks Grid -->
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <template x-for="red in currentWeek.redes" :key="red.nombre">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                        <!-- Card Header -->
                        <div class="p-4 border-b flex justify-between items-center" :class="red.color">
                            <div class="flex items-center gap-2">
                                <span class="text-white text-xs font-bold px-2 py-1 rounded shadow-sm" :class="red.badge" x-text="red.nombre"></span>
                                <span class="font-medium opacity-80" x-text="red.dia"></span>
                            </div>
                        </div>
                        
                        <!-- Card Body (Editable Content) -->
                        <div class="p-6 flex-1 text-slate-700 text-sm leading-relaxed relative group">
                            <!-- Botón de edición -->
                            <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded shadow-sm">Haz clic en el texto para editar</span>
                            </div>
                            
                            <div class="outline-none focus:ring-2 focus:ring-indigo-300 focus:bg-indigo-50 p-2 rounded transition-colors"
                                 contenteditable="true"
                                 x-html="getSavedContent(currentWeek.semana, red.nombre, red.contenido)"
                                 @blur="saveContent(currentWeek.semana, red.nombre, $event.target.innerHTML)">
                            </div>
                        </div>

                        <!-- Multimedia Folder Path -->
                        <div class="bg-slate-100 px-4 py-3 border-t border-slate-200 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                                <span class="text-xs text-slate-600 font-mono">Carpeta: Material/Enero/Semana_<span x-text="currentWeek.semana"></span>/<span x-text="red.nombre"></span></span>
                            </div>
                            <span class="text-[10px] bg-slate-200 text-slate-500 px-2 py-0.5 rounded">Guarda videos/audios aquí</span>
                        </div>

                        <!-- Card Footer (Checklist) -->
                        <div class="bg-slate-50 p-4 border-t border-slate-200">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Checklist de Producción</h4>
                            <div class="space-y-2">
                                <template x-for="task in getTasksForNetwork(red.nombre)">
                                    <label class="flex items-center gap-3 cursor-pointer group">
                                        <div class="relative flex items-center justify-center">
                                            <input type="checkbox" class="checkbox-custom opacity-0 absolute h-5 w-5 cursor-pointer" 
                                                   x-model="checklists[currentWeek.semana + '_' + red.nombre + '_' + task]"
                                                   @change="saveChecklists()">
                                            <div class="h-5 w-5 border-2 border-slate-300 rounded bg-white transition-colors flex items-center justify-center group-hover:border-indigo-400">
                                                <svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                        </div>
                                        <span class="text-sm text-slate-600 group-hover:text-slate-900 transition-colors" x-text="task" :class="checklists[currentWeek.semana + '_' + red.nombre + '_' + task] ? 'line-through text-slate-400' : ''"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            
            <div class="mt-8 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-4">
                    <button @click="exportBackup()" class="text-sm bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg hover:bg-indigo-100 transition-colors font-medium flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Guardar Copia de Seguridad
                    </button>
                    
                    <label class="cursor-pointer text-sm bg-slate-50 text-slate-700 px-4 py-2 rounded-lg hover:bg-slate-100 transition-colors border border-slate-200 font-medium flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Restaurar Copia
                        <input type="file" accept=".json" class="hidden" @change="importBackup($event)">
                    </label>
                </div>
                <button @click="clearProgress()" class="text-xs text-red-500 hover:text-red-700 underline">Reiniciar todo el progreso</button>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Version 8 compat for simplicity) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCr_a2T6ibPvrNs9UjEL0xzMCHdIgQkX3Q",
            authDomain: "app-redes-94ea9.firebaseapp.com",
            projectId: "app-redes-94ea9",
            storageBucket: "app-redes-94ea9.firebasestorage.app",
            messagingSenderId: "140758336533",
            appId: "1:140758336533:web:9b766cc9ff6acca390ba1c"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function appData() {
            return {
                planData: planData, // Loaded from data.js
                currentWeekIndex: 0,
                checklists: {},
                savedTexts: {},
                cloudSyncing: false, // Indicador visual de guardado
                
                // Nuevas variables para el acordeón
                mesesList: ["01 - Enero", "02 - Febrero", "03 - Marzo", "04 - Abril", "05 - Mayo", "06 - Junio", "07 - Julio", "08 - Agosto", "09 - Septiembre", "10 - Octubre", "11 - Noviembre", "12 - Diciembre"],
                mesesAbiertos: { "01 - Enero": true },

                get currentWeek() {
                    return this.planData[this.currentWeekIndex];
                },

                initApp() {
                    // Primero intentamos cargar desde Firebase
                    db.collection("redes_data").doc("estado_actual").get().then((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.checklists) this.checklists = data.checklists;
                            else this.initEmptyChecklists();
                            
                            if (data.savedTexts) this.savedTexts = data.savedTexts;
                            
                            // Guardamos copia local por si acaso
                            localStorage.setItem('parroquia_checklists', JSON.stringify(this.checklists));
                            localStorage.setItem('parroquia_texts', JSON.stringify(this.savedTexts));
                        } else {
                            // Si no hay nube, cargamos local
                            this.loadLocalFallback();
                        }
                    }).catch(error => {
                        console.error("Error cargando de la nube:", error);
                        this.loadLocalFallback();
                    });
                },

                loadLocalFallback() {
                    const savedChecks = localStorage.getItem('parroquia_checklists');
                    if (savedChecks) this.checklists = JSON.parse(savedChecks);
                    else this.initEmptyChecklists();

                    const savedContent = localStorage.getItem('parroquia_texts');
                    if (savedContent) this.savedTexts = JSON.parse(savedContent);
                },

                initEmptyChecklists() {
                    this.planData.forEach(week => {
                        week.redes.forEach(red => {
                            this.getTasksForNetwork(red.nombre).forEach(task => {
                                this.checklists[week.semana + '_' + red.nombre + '_' + task] = false;
                            });
                        });
                    });
                },

                selectWeek(index) {
                    this.currentWeekIndex = index;
                    // En celulares, hacer scroll automático hacia abajo donde está el texto
                    if (window.innerWidth < 768) {
                        setTimeout(() => {
                            document.getElementById('content-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 100);
                    } else {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                toggleMes(mes) {
                    this.mesesAbiertos[mes] = !this.mesesAbiertos[mes];
                },

                getWeeksForMonth(mes) {
                    return this.planData.map((w, index) => {
                        return { ...w, originalIndex: index };
                    }).filter(w => w.mes === mes);
                },

                getTasksForNetwork(nombre) {
                    switch(nombre) {
                        case 'WhatsApp':
                            return ['Mensaje 1 (Texto) Revisado', 'Mensaje 2 (Audio) Grabado', 'Mensaje 3 (Reto) Revisado', 'Enviado a la comunidad'];
                        case 'Instagram':
                            return ['Guion y Copy Revisados', 'Carrusel / Reel Creado', 'Publicado / Programado'];
                        case 'TikTok':
                            return ['Guion Revisado', 'Video Grabado', 'Video Editado', 'Publicado / Programado'];
                        case 'Facebook':
                            return ['Texto Revisado', 'Imagen de apoyo creada', 'Publicado / Programado'];
                        default:
                            return ['Guion Revisado', 'Material Creado', 'Publicado / Programado'];
                    }
                },

                saveChecklists() {
                    localStorage.setItem('parroquia_checklists', JSON.stringify(this.checklists));
                    this.saveToCloud();
                },

                // Text Editing Logic
                getSavedContent(semana, redNombre, defaultContent) {
                    const key = semana + '_' + redNombre;
                    return this.savedTexts[key] || defaultContent;
                },

                saveContent(semana, redNombre, newHtml) {
                    const key = semana + '_' + redNombre;
                    this.savedTexts[key] = newHtml;
                    localStorage.setItem('parroquia_texts', JSON.stringify(this.savedTexts));
                    this.saveToCloud();
                },

                saveToCloud() {
                    this.cloudSyncing = true;
                    db.collection("redes_data").doc("estado_actual").set({
                        checklists: Alpine.raw(this.checklists),
                        savedTexts: Alpine.raw(this.savedTexts)
                    }).then(() => {
                        setTimeout(() => this.cloudSyncing = false, 1000);
                    }).catch(error => {
                        console.error("Error guardando en la nube:", error);
                        this.cloudSyncing = false;
                    });
                },

                getWeekProgress(weekIndex) {
                    const week = this.planData[weekIndex];
                    let totalTasks = 0;
                    let completedTasks = 0;

                    week.redes.forEach(red => {
                        this.getTasksForNetwork(red.nombre).forEach(task => {
                            totalTasks++;
                            if (this.checklists[week.semana + '_' + red.nombre + '_' + task]) {
                                completedTasks++;
                            }
                        });
                    });

                    if (totalTasks === 0) return 0;
                    return Math.round((completedTasks / totalTasks) * 100);
                },

                clearProgress() {
                    if(confirm("¿Estás seguro de reiniciar TODO el progreso y textos a su estado original?")) {
                        this.checklists = {};
                        this.savedTexts = {};
                        this.initEmptyChecklists();
                        localStorage.removeItem('parroquia_texts');
                        localStorage.removeItem('parroquia_checklists');
                        this.saveToCloud();
                        alert("Progreso reiniciado. Recargando...");
                        location.reload();
                    }
                },

                // Backups
                exportBackup() {
                    const data = {
                        checklists: this.checklists,
                        savedTexts: this.savedTexts
                    };
                    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Copia_Seguridad_Parroquia_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert("¡Copia de seguridad descargada con éxito!");
                },

                importBackup(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (data.checklists) {
                                this.checklists = data.checklists;
                                this.saveChecklists();
                            }
                            if (data.savedTexts) {
                                this.savedTexts = data.savedTexts;
                                localStorage.setItem('parroquia_texts', JSON.stringify(this.savedTexts));
                            }
                            alert("¡Copia restaurada con éxito! La página se actualizará.");
                            location.reload();
                        } catch (error) {
                            alert("Error al leer el archivo. Asegúrate de subir el archivo .json correcto.");
                        }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
</body>
</html>
